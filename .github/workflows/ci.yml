name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.13.6
      - run: uv sync --locked --group dev --extra glb
      - run: uv build
      - run: uv run --locked pytest -n 4
